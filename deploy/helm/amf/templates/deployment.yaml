apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-amf
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: AMF's in-memory UE context/subscription storage (see docs/DECISIONS.md,
  # nfs/amf/src/main.cpp's file header) has no shared state across pods -- scaling this deployment
  # would give each replica a different, inconsistent view. Same rationale as nrf's chart.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: amf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7778
              protocol: TCP
            - name: metrics
              containerPort: 9465
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
