apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pcf
  labels:
    app.kubernetes.io/name: pcf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: PCF's in-memory policy storage (see docs/DECISIONS.md ADR-0028,
  # nfs/pcf/src/main.cpp's file header) has no shared state across pods -- scaling this
  # deployment would give each replica a different, inconsistent view. Same rationale as
  # nrf's/amf's/smf's/udm's/udr's/ausf's charts.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pcf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pcf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: pcf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7783
              protocol: TCP
            - name: metrics
              containerPort: 9470
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
