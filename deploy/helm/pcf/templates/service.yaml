apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pcf
  labels:
    app.kubernetes.io/name: pcf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: pcf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7783
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9470
      targetPort: metrics
      protocol: TCP
