apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-smf
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: SMF's in-memory SM context storage (see docs/DECISIONS.md,
  # nfs/smf/src/main.cpp's file header) has no shared state across pods -- scaling this deployment
  # would give each replica a different, inconsistent view. Same rationale as nrf's/amf's charts.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: smf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7779
              protocol: TCP
            - name: metrics
              containerPort: 9466
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
