apiVersion: v2
name: udm
description: >
  UDM (Unified Data Management) -- TS 29.503 Nudm_UECM (AMF/SMF registration groups) + Nudm_SDM
  (subscriber data retrieval, subscriptions). Lab-grade Helm chart; see docs/DECISIONS.md for what
  "lab-grade" means here (in-memory registration/subscription storage, no HA, no real UDR behind
  GetAmData/GetSmfSelData/GetSmData). DISCLOSED GAP, not silently shipped: same as
  deploy/helm/amf/Chart.yaml and deploy/helm/smf/Chart.yaml -- this chart does not provision PKI at
  all, and udm/smf/amf/nrf are separate Helm releases with no shared-secret mechanism between them
  yet. Proper fix deferred to Phase 8 (lab packaging and conformance) per PROMPT.md.
type: application
