apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-udm
  labels:
    app.kubernetes.io/name: udm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: UDM's in-memory registration/subscription storage (see docs/DECISIONS.md,
  # nfs/udm/src/main.cpp's file header) has no shared state across pods -- scaling this deployment
  # would give each replica a different, inconsistent view. Same rationale as nrf's/amf's/smf's
  # charts.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: udm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udm
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: udm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7780
              protocol: TCP
            - name: metrics
              containerPort: 9467
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
