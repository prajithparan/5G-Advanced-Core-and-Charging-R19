# ransim lab UE config for UERANSIM's nr-ue.
# Format is UERANSIM's own (see vendor/UERANSIM/config/custom-ue.yaml after fetching) --
# not a 3GPP-defined schema, just this simulator's config file. Key/OP values below are
# UERANSIM's own published test-vector defaults (not real subscriber credentials, not our
# own invention), for use against a matching lab UDM/AUSF subscriber record once those NFs
# exist.
#
# NOT FUNCTIONAL YET: no gNB is reachable (config/gnb.yaml's AMF target has no listener) and
# no UDM/AUSF exist yet to authenticate against. See docs/DECISIONS.md ADR-0016.

supi: 'imsi-999700000000001'   # Test PLMN (999/70, see ADR-0016) + arbitrary MSIN
mcc: '999'
mnc: '70'
protectionScheme: 0             # Null-scheme SUCI (no home-network public key needed)
routingIndicator: '0000'

key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
op: 'E8ED289DEBA952E4283B54E88E6183CA'
opType: 'OP'
amf: '8000'

tunNetmask: '255.255.255.0'
useNamespace: false

gnbSearchList:
  - 127.0.0.1

sessions:
  - type: 'IPv4'
    apn: 'internet'
    slice:
      sst: 1
      sd: 1

configured-nssai:
  - sst: 1
    sd: 1

default-nssai:
  - sst: 1
    sd: 1

integrity:
  IA1: true
  IA2: true
  IA3: true

ciphering:
  EA1: true
  EA2: true
  EA3: true
